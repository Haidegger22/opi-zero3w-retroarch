# Рабочий конфиг RetroArch для OPi Zero 3W + PaHub + GPIO-кнопки
# Управление: Джойстик V2 → стрелки, GPIO → A/B, CardKB → Start/Select/Esc

config_save_on_exit = "false"
audio_driver = "pulse"
audio_out_rate = 48000

# ⚠️ ТОЛЬКО sdl2! "x" вызывает segfault/fork-bomb на EGL/PowerVR
input_driver = "sdl2"

video_fullscreen = "true"
video_vsync = "false"
menu_driver = "rgui"

# GPIO кнопка (пин 22) = A (прыжок) — шлётся как клавиша "0"
input_player1_a = "num0"
# GPIO кнопка (пин 21) = B (бег/огонь) — шлётся как Backspace
input_player1_b = "Backspace"
# CardKB
input_player1_start = "enter"
input_player1_select = "space"

# Джойстик V2 (через game_input.py)
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"

input_quit = "escape"
